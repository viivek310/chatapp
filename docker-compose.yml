services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vchat-app
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: .env.local
        required: false
      - path: env.local
        required: false
      - path: .env
        required: false
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - app-uploads:/app/backend/uploads
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5000}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-changeme_in_env_production}
      - MONGO_DATABASE=${MONGO_DATABASE:-vchat}
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme_in_env_production}@mongo:27017/${MONGO_DATABASE:-vchat}?authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-vchat_production_jwt_secret_change_in_env}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - vchat-network

  mongo:
    image: mongo:7.0
    container_name: vchat-mongo
    restart: unless-stopped
    # Limit WiredTiger cache to 256MB for minimal footprint in low-traffic portfolio demos
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    env_file:
      - path: .env.production
        required: false
      - path: .env.local
        required: false
      - path: env.local
        required: false
      - path: .env
        required: false
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-changeme_in_env_production}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-vchat}
    # No external ports exposed to the host machine.
    # MongoDB is isolated and accessible only within the internal docker network.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet || mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 128M
    networks:
      - vchat-network

networks:
  vchat-network:
    driver: bridge

volumes:
  mongo-data:
  app-uploads:

