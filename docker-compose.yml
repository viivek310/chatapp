services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vchat-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/vchat
      - JWT_SECRET=production_jwt_secret_change_me
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongo
    networks:
      - vchat-network

  mongo:
    image: mongo:7.0
    container_name: vchat-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - vchat-network

networks:
  vchat-network:
    driver: bridge

volumes:
  mongo-data:
